<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理ダッシュボード | We Play 管理システム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin.css">

    <!-- Libraries -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-client.js"></script>

    <!-- Force Sidebar Visibility for Mobile Debugging -->
    <style>
        @media (max-width: 1600px) {

            /* Force toggle button to show */
            .mobile-menu-toggle {
                display: flex !important;
                z-index: 2147483647 !important;
                /* Max z-index */
            }
        }

        /* Ensure sidebar overlay is high z-index too */
        .sidebar-overlay {
            z-index: 2147483640 !important;
        }

        .sidebar.open {
            z-index: 2147483641 !important;
        }
    </style>
</head>

<body>

    <!-- Structure -->
    <div class="dashboard-container">
        <!-- Sidebar Placeholder (Target for renderSidebar) -->
        <div id="app-sidebar"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-search">
                    <i data-lucide="search"></i>
                    <input type="text" placeholder="検索...">
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <!-- Profile content injected by JS -->
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="welcome-banner">
                    <h1>Dashboard</h1>
                    <p>現在の応募状況とステータスを確認できます</p>
                </div>

                <!-- Stats Grid -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon" style="--color: #00f2ff;">
                            <i data-lucide="users"></i>
                        </div>
                        <div class="stat-info">
                            <span class="label">総応募数</span>
                            <span class="count" id="stat-total">-</span>
                        </div>
                    </div>
                    <!-- Role stats injected here -->
                    <div id="roles-stats-container" style="display: contents;"></div>
                </div>

                <!-- Charts Row -->
                <div class="charts-row">
                    <div class="chart-container">
                        <h3><i data-lucide="bar-chart-2"></i> 日別応募推移 (直近7日間)</h3>
                        <canvas id="registrationTrend"></canvas>
                    </div>
                    <div class="chart-container">
                        <h3><i data-lucide="pie-chart"></i> 知ったきっかけ</h3>
                        <canvas id="referralSource"></canvas>
                    </div>
                </div>

                <!-- Recent Applicants -->
                <div class="table-container">
                    <div class="table-header">
                        <h3><i data-lucide="clock"></i> 最新の応募・更新</h3>
                        <button class="view-all" onclick="location.href='applicants.html'">すべて見る</button>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>氏名 / メール</th>
                                <th>学校 / 学年</th>
                                <th>希望役割</th>
                                <th>応募日</th>
                                <th>ステータス</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <!-- Force reload with new timestamp -->
    <script src="components.js?v=jp_fix_v4"></script>
    <script src="dashboard.js?v=final_fix_v5"></script>
    <script>
        // Init happens automatically in components.js
        // Extra failsafe check
        window.addEventListener('load', function () {
            setTimeout(function () {
                if (typeof window.debugLog === 'function') window.debugLog('Dashboard.html loaded (v5).');

                // Check if sidebar rendered
                if (!document.querySelector('.sidebar')) {
                    if (typeof window.debugLog === 'function') window.debugLog('ERROR: Sidebar NOT rendered automatically.');
                    if (typeof window.initAdminUI === 'function') {
                        window.initAdminUI(); // Retry
                    }
                }

                // Check mobile toggle
                if (typeof ensureMobileToggle === 'function') {
                    ensureMobileToggle();
                }
            }, 500);
        });

        lucide.createIcons();
    </script>
</body>

</html>
