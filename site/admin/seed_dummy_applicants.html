<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Seeding Dummy Data</title>
</head>

<body>
    <h1>Seeding Dummy Data...</h1>
    <div id="status">Running...</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/lib/supabase-client.js"></script>
    <script>
        async function seed() {
            const statusDiv = document.getElementById('status');
            try {
                if (!window.supabaseClient) throw new Error('Supabase client not initialized');

                // 1. Get Roles
                const { data: roles, error: roleError } = await window.supabaseClient
                    .from('master_role')
                    .select('id, name');

                if (roleError) throw roleError;
                if (!roles.length) throw new Error('No roles found in master_role');

                console.log('Roles found:', roles);

                // 2. Generate Dummy Data
                const dummies = [];
                const schools = ['福山高校', '誠之館高校', '明王台高校', '葦陽高校', '大門高校'];
                const firstNames = ['太郎', '花子', '次郎', '美咲', '健太', '結衣', '翔', 'さくら', '大輔', '優'];
                const lastNames = ['佐藤', '鈴木', '高橋', '田中', '伊藤', '渡辺', '山本', '中村', '小林', '加藤'];

                for (let i = 0; i < 10; i++) {
                    const lName = lastNames[i % lastNames.length];
                    const fName = firstNames[i % firstNames.length];
                    const role = roles[Math.floor(Math.random() * roles.length)];

                    dummies.push({
                        full_name: `${lName} ${fName}`,
                        full_kana: 'ダミー', // Simplified
                        school_name: schools[Math.floor(Math.random() * schools.length)],
                        grade: `${Math.floor(Math.random() * 3) + 1}年生`,
                        phone: `090-${Math.floor(1000 + Math.random() * 9000)}-${Math.floor(1000 + Math.random() * 9000)}`,
                        email: `dummy${i}@example.com`,
                        status: '採用',
                        assigned_role_id: role.id,
                        created_at: new Date().toISOString()
                    });
                }

                // 3. Insert
                const { error: insertError } = await window.supabaseClient
                    .from('applicants')
                    .insert(dummies);

                if (insertError) throw insertError;

                statusDiv.textContent = 'Success: Inserted 10 records.';
                console.log('Success');

            } catch (err) {
                console.error(err);
                statusDiv.textContent = 'Error: ' + err.message;
            }
        }

        seed();
    </script>
</body>

</html>
