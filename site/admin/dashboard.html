<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理ダッシュボード | We Play 管理システム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap"
        rel="stylesheet">
    


</head>

<body>
    <!-- App Root -->
    <div id="app"></div>

    <!-- Page Content Template -->
    <template id="page-template">
        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="--color: #00f2ff;">
                    <i data-lucide="users"></i>
                </div>
                <div class="stat-info">
                    <span class="label">総応募数</span>
                    <span class="count" id="stat-total">-</span>
                </div>
            </div>
            <!-- Role stats injected here -->
            <div id="roles-stats-container" style="display: contents;"></div>
        </div>

        <!-- Charts Row -->
        <div class="charts-row">
            <div class="chart-container">
                <h3><i data-lucide="bar-chart-2"></i> 日別応募推移 (直近7日間)</h3>
                <canvas id="registrationTrend"></canvas>
            </div>
            <div class="chart-container">
                <h3><i data-lucide="pie-chart"></i> 知ったきっかけ</h3>
                <canvas id="referralSource"></canvas>
            </div>
        </div>

        <!-- Recent Applicants -->
        <div class="table-container">
            <div class="table-header">
                <h3><i data-lucide="clock"></i> 最新の応募・更新</h3>
                <button class="view-all" onclick="location.href='applicants.html'">すべて見る</button>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>氏名 / メール</th>
                        <th>学校 / 学年</th>
                        <th>希望役割</th>
                        <th>応募日</th>
                        <th>ステータス</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Injected by JS -->
                </tbody>
            </table>
        </div>
    </template>

    <!-- Vite Entry Point -->
    <script type="module" src="../../src/pages/admin/dashboard/main.js"></script>
</body>

</html>
