<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>応募者一覧 | We Play 管理システム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap"
        rel="stylesheet">
    

    <style>
        .data-table tbody tr {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.002) translateX(4px);
        }

        /* Premium Pagination Styles */
        .pagination {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .page-btn {
            min-width: 40px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 14px;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .page-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .page-btn.active {
            background: white;
            color: #111;
            border-color: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: rgba(255, 255, 255, 0.02);
            transform: none !important;
        }

        .results-info {
            font-size: 0.9rem;
            color: var(--text-dim);
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.5px;
        }

        /* Filter polish */
        .admin-select {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 14px !important;
            padding: 0.6rem 1rem !important;
            transition: all 0.3s ease !important;
        }

        .admin-select:focus {
            border-color: var(--primary) !important;
            background: rgba(255, 255, 255, 0.08) !important;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
        }
    </style>
</head>

<body>
    <!-- App Root -->
    <div id="app"></div>

    <!-- Page Content Template -->
    <template id="page-template">
        <!-- Filters area -->
        <div class="filters-row" style="display: flex; gap: 1rem; margin-bottom: 2rem;">
            <div class="filter-group">
                <select id="roleFilter" class="admin-select">
                    <option value="">すべての希望役職</option>
                </select>
            </div>
            <div class="filter-group">
                <select id="statusFilter" class="admin-select">
                    <option value="">すべてのステータス</option>
                    <option value="新規">新規</option>
                    <option value="確認済み">確認済み</option>
                    <option value="採用">採用</option>
                    <option value="不採用">不採用</option>
                </select>
            </div>
            <div class="filter-group">
                <select id="limitFilter" class="admin-select">
                    <option value="20">20件表示</option>
                    <option value="50">50件表示</option>
                    <option value="100">100件表示</option>
                </select>
            </div>
            <button class="export-btn"
                style="margin-left: auto; display: flex; align-items: center; gap: 0.5rem; background: rgba(0, 242, 255, 0.1); border: 1px solid var(--primary); color: var(--primary); padding: 0.5rem 1.2rem; border-radius: 12px; cursor: pointer;">
                <i data-lucide="download" style="width: 18px;"></i> CSV出力
            </button>
        </div>

        <!-- Applicants Table -->
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>氏名 / 学校</th>
                        <th>学年</th>
                        <th>性別</th>
                        <th>第一</th>
                        <th>第二</th>
                        <th>第三</th>
                        <th>応募日</th>
                        <th>ステータス</th>
                        <th style="text-align: right;">アクション</th>
                    </tr>
                </thead>
                <tbody id="applicantsTableBody">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>

            <div class="table-footer"
                style="margin-top: 2rem; display: flex; justify-content: space-between; align-items: center; padding: 0 1rem;">
                <div class="results-info" style="font-size: 0.9rem; color: var(--text-dim);">
                    全 0 件を表示
                </div>
                <div class="pagination">
                    <!-- JS will inject buttons here -->
                </div>
            </div>
        </div>

        <!-- Detail Modal (Inside Template to stay accessible) -->
        <div class="modal-overlay" id="detailModal">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <span id="modalKana" style="font-size: 0.8rem; color: var(--text-dim); display: block;"></span>
                        <h2 id="modalName" style="font-weight: 800; font-size: 1.5rem; margin-bottom: 0.2rem;">氏名 未設定
                        </h2>
                        <span id="modalDate" style="font-size: 0.8rem; color: var(--text-dim);">応募日: -</span>
                    </div>
                    <button class="close-modal" onclick="closeModal()">
                        <i data-lucide="x"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
                        <div class="detail-section">
                            <h4>基本情報</h4>
                            <div class="detail-text">
                                <div style="margin-bottom: 0.8rem;">
                                    <label
                                        style="display: block; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.2rem;">性別</label>
                                    <p id="modalGender" style="font-weight: 600;"></p>
                                </div>
                                <div style="margin-bottom: 0.8rem;">
                                    <label
                                        style="display: block; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.2rem;">学校
                                        / 学年</label>
                                    <p id="modalSchoolGrade" style="font-weight: 600;"></p>
                                </div>
                                <div style="margin-bottom: 0.8rem;">
                                    <label
                                        style="display: block; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.2rem;">メールアドレス</label>
                                    <p id="modalEmail" style="font-weight: 400;"></p>
                                </div>
                                <div>
                                    <label
                                        style="display: block; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.2rem;">電話番号</label>
                                    <p id="modalPhone" style="font-weight: 400;"></p>
                                </div>
                                <div style="margin-top: 0.8rem;">
                                    <label
                                        style="display: block; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.2rem;">LINE連携</label>
                                    <p id="modalLineId"
                                        style="font-weight: 400; font-family: monospace; font-size: 0.8rem;"></p>
                                </div>
                            </div>
                        </div>

                        <div class="detail-section">
                            <h4>希望・認知経路</h4>
                            <div class="detail-text">
                                <div style="margin-bottom: 0.8rem;">
                                    <label
                                        style="display: block; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.2rem;">役職希望</label>
                                    <p style="font-size: 0.9rem;">1: <strong id="role1"></strong></p>
                                    <p style="font-size: 0.9rem;">2: <strong id="role2"></strong></p>
                                    <p style="font-size: 0.9rem;">3: <strong id="role3"></strong></p>
                                </div>
                                <div>
                                    <label
                                        style="display: block; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.2rem;">認知経路</label>
                                    <p id="modalReferral" style="font-size: 0.9rem;"></p>
                                    <p id="modalReferralOther"
                                        style="font-size: 0.8rem; color: var(--text-dim); margin-top: 0.2rem;"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h4>ご要望・メッセージ</h4>
                        <div class="detail-text" id="modalMessage" style="min-height: 100px; line-height: 1.6;"></div>
                    </div>

                    <div class="modal-footer"
                        style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--glass-border);">
                        <div class="detail-section">
                            <h4>ステータス管理</h4>
                            <div class="detail-text">
                                <label
                                    style="display: block; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.5rem;">現在のステータス</label>
                                <select id="modalStatus" class="admin-select"
                                    style="width: 100%; margin-bottom: 1.5rem;">
                                    <option value="新規">新規</option>
                                    <option value="確認済み">確認済み</option>
                                    <option value="採用">採用</option>
                                    <option value="不採用">不採用</option>
                                </select>

                                <label
                                    style="display: block; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.5rem;">役職決定</label>
                                <select id="modalAssignedRole" class="admin-select"
                                    style="width: 100%; margin-bottom: 1.5rem;">
                                    <option value="">未定</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1rem;">
                        <button onclick="closeModal()"
                            style="background: transparent; border: 1px solid var(--glass-border); color: white; padding: 0.6rem 1.5rem; border-radius: 12px; cursor: pointer;">閉じる</button>
                        <button id="saveStatusBtn"
                            style="background: var(--primary); color: black; border: none; padding: 0.6rem 2rem; border-radius: 12px; font-weight: 700; cursor: pointer;">変更を保存</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Vite Entry Point -->
    <script type="module" src="../../src/pages/admin/applicants/main.js"></script>
</body>

</html>
